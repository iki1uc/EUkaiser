<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚜️ EU · KAISER · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;overflow:hidden;
    background:#05030a;color:#f0e0c0;
    font-family:'Yu Mincho','Times New Roman',serif;
    user-select:none;cursor:default;
  }
  canvas{display:block;width:100vw;height:100vh;}

  /* SIEGEL PANEL */
  #sealInfo{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    z-index:5;
    opacity:0;
    transition:opacity 1.4s;
  }
  #sealInfo.show{opacity:1;}
  #sealInfo .eu{
    font-size:64px;
    letter-spacing:12px;
    color:#f4d060;
    text-shadow:
      0 0 30px rgba(212,168,60,0.9),
      0 0 80px rgba(244,208,96,0.6);
    font-weight:900;
    line-height:1;
  }
  #sealInfo .kaiser{
    font-size:22px;
    letter-spacing:14px;
    color:#f4e0a0;
    margin-top:10px;
    text-transform:uppercase;
    font-family:'Consolas',monospace;
  }

  /* FORMEL PANEL (unten links) */
  #formula{
    position:fixed;bottom:24px;left:24px;
    background:rgba(8,5,15,0.82);
    border-left:3px solid #d4a83c;
    padding:16px 22px;
    font-family:'Consolas',monospace;
    font-size:13px;
    line-height:2;
    color:#c0b090;
    z-index:8;
    min-width:270px;
    backdrop-filter:blur(6px);
  }
  #formula .head{
    color:#f4d060;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    border-bottom:1px solid rgba(212,168,60,0.2);
    padding-bottom:6px;margin-bottom:8px;
  }
  #formula .row{
    display:flex;justify-content:space-between;
    opacity:0;
    transition:opacity .5s;
  }
  #formula .row.show{opacity:1;}
  #formula .k{color:#8a7a5a;}
  #formula .v{color:#f4e0a0;font-weight:bold;}
  #formula .v.gold{color:#f4d060;}
  #formula .v.green{color:#8cf0b0;}

  /* KONFIRMATION SIEGEL (oben rechts) */
  #confirmed{
    position:fixed;top:24px;right:24px;
    background:rgba(8,5,15,0.85);
    border:1px solid rgba(212,168,60,0.35);
    border-radius:4px;
    padding:12px 20px;
    font-family:'Consolas',monospace;
    z-index:8;
    text-align:center;
    opacity:0;
    transform:translateY(-10px);
    transition:opacity .6s, transform .6s;
  }
  #confirmed.show{opacity:1;transform:translateY(0);}
  #confirmed .stamp{
    color:#8cf0b0;
    font-size:14px;
    letter-spacing:3px;
    font-weight:bold;
    text-shadow:0 0 12px rgba(140,240,176,0.6);
  }
  #confirmed .sub{
    color:#6a5a4a;
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
    text-transform:uppercase;
  }

  /* HEADER */
  #header{
    position:fixed;top:20px;left:24px;
    font-family:'Consolas',monospace;
    font-size:10px;
    letter-spacing:4px;
    color:#8a7a5a;
    z-index:8;
    text-transform:uppercase;
  }
  #header .gold{color:#f4d060;}

  /* MODUL COUNT (unten rechts) */
  #modCount{
    position:fixed;bottom:24px;right:24px;
    background:rgba(8,5,15,0.82);
    border:1px solid rgba(212,168,60,0.25);
    padding:12px 18px;
    font-family:'Consolas',monospace;
    font-size:11px;
    color:#8a7a5a;
    z-index:8;
    min-width:170px;
    line-height:1.9;
  }
  #modCount .num{
    color:#f4d060;font-weight:bold;
  }
  #modCount .head{
    color:#f4d060;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    border-bottom:1px solid rgba(212,168,60,0.15);
    padding-bottom:5px;margin-bottom:6px;
    display:flex;justify-content:space-between;
  }

  @media(max-width:720px){
    #sealInfo .eu{font-size:40px;letter-spacing:6px;}
    #sealInfo .kaiser{font-size:14px;letter-spacing:6px;}
    #formula{font-size:11px;padding:10px 14px;min-width:0;bottom:14px;left:14px;line-height:1.7;}
    #confirmed{top:14px;right:14px;padding:8px 14px;}
    #confirmed .stamp{font-size:11px;}
    #modCount{bottom:14px;right:14px;padding:8px 12px;font-size:10px;min-width:0;}
    #header{top:14px;left:14px;font-size:9px;}
  }
</style>
</head>
<body>

<canvas id="seal"></canvas>

<div id="header">
  <span class="gold">⚜</span> iki1uc · CONFIRMATION · R00T
</div>

<div id="sealInfo">
  <div class="eu">EU</div>
  <div class="kaiser">Kaiser</div>
</div>

<div id="formula">
  <div class="head">· Formel ·</div>
  <div class="row" data-i="0"><span class="k">UNI</span><span class="v gold">1</span></div>
  <div class="row" data-i="1"><span class="k">ROOM</span><span class="v gold">3</span></div>
  <div class="row" data-i="2"><span class="k">NC</span><span class="v gold">9</span></div>
  <div class="row" data-i="3"><span class="k">ATOM</span><span class="v gold">243</span></div>
  <div class="row" data-i="4"><span class="k">FLOW</span><span class="v gold">∞</span></div>
  <div class="row" data-i="5"><span class="k">ZAM</span><span class="v gold">門</span></div>
</div>

<div id="modCount">
  <div class="head"><span>· SYSTEM ·</span><span id="sysState">…</span></div>
  <div>NC-Module <span class="num" id="modNum">0</span>/12</div>
  <div>Rooms <span class="num" id="roomNum">0</span>/5</div>
  <div>Achsen <span class="num" id="axisNum">0</span>/243</div>
  <div>Status <span class="num" id="statusNum">—</span></div>
</div>

<div id="confirmed">
  <div class="stamp">✓ SYSTEM BESTÄTIGT</div>
  <div class="sub">NC · Commands OK</div>
</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// ⚜️ EU · KAISER · FORMEL · CONFIRMATION
// Die Bestätigung: NC-Kommandos laufen — als Code, als Siegel, als Formel.
// ═══════════════════════════════════════════════════════════════════

// ─── KONSTANTEN ───────────────────────────────────────────────────
const MODULES = [
  'NC_figur', 'NC_kraft', 'NC_space', 'NC_time',
  'OS_CORE', 'axiom.map', 'coord', 'dreieck',
  'respo', 'router', 'vec', 'resolver'
];
const ROOMS = ['X.CORE', 'X.IN', 'X.OUT', 'Y', 'B'];
const NUMBERS = [3, 9, 27, 81, 243];       // 3^1 … 3^5
const NUM_ANGLES = [
  {r:1.0, speed: 0.006},
  {r:1.3, speed:-0.004},
  {r:1.6, speed: 0.003},
  {r:1.9, speed:-0.002},
  {r:2.2, speed: 0.0015},
];

// ─── STATE ────────────────────────────────────────────────────────
const S = {
  tick: 0,
  modulesPinged: 0,
  roomsPinged: 0,
  axisTick: 0,
  startedAt: Date.now(),
  sealOpened: false,
  confirmed: false,
  // Roome nodes positions
  roomNodes: [],
  // Module nodes positions
  modNodes: [],
  // Kira sparkles
  sparks: [],
  // Screen flash
  flash: 0,
  // Imperial aura pulse
  auraPulse: 0,
};

// ─── CANVAS ───────────────────────────────────────────────────────
const cv = document.getElementById('seal');
const ctx = cv.getContext('2d');
let W, H, CX, CY, R, DPR;

function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  R = Math.min(W,H)*0.26;
  layoutNodes();
}
window.addEventListener('resize', resize);

function layoutNodes(){
  // Module rund um das Siegel (äußerer Ring)
  S.modNodes = MODULES.map((m,i)=>{
    const a = (i/MODULES.length) * Math.PI * 2 - Math.PI/2;
    return {
      name: m,
      a,
      r: R * 2.5,
      x: CX + Math.cos(a)*R*2.5,
      y: CY + Math.sin(a)*R*2.5,
      glow: 0,
    };
  });
  // Rooms als 5 Knoten weiter außen
  S.roomNodes = ROOMS.map((n,i)=>{
    const a = (i/ROOMS.length) * Math.PI * 2 - Math.PI/2 + 0.3;
    return {
      name: n,
      a,
      r: R * 3.1,
      x: CX + Math.cos(a)*R*3.1,
      y: CY + Math.sin(a)*R*3.1,
      glow: 0,
    };
  });
}

// ─── ZEICHNEN ─────────────────────────────────────────────────────
function draw(){
  // Hintergrund — tiefer Kaiser-Samt
  const bg = ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.85);
  bg.addColorStop(0, '#1a0e1c');
  bg.addColorStop(0.45, '#0d0612');
  bg.addColorStop(1, '#05030a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // Aura (kaiserlich — gold, pulsierend)
  const auraR = R * 2.2 + Math.sin(S.auraPulse*0.04) * 8;
  const aura = ctx.createRadialGradient(CX,CY,0,CX,CY,auraR);
  aura.addColorStop(0, 'rgba(244,208,96,0.10)');
  aura.addColorStop(0.5, 'rgba(212,168,60,0.04)');
  aura.addColorStop(1, 'rgba(212,168,60,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(CX,CY,auraR,0,Math.PI*2); ctx.fill();

  // Kaiserliche Radiallinien (Sonnenstrahlen)
  drawRadiatingLines();

  // Zahlen-Ringe (3, 9, 27, 81, 243)
  drawNumberRings();

  // Zentrales Siegel
  drawCentralSeal();

  // Module nodes
  drawModNodes();

  // Room nodes
  drawRoomNodes();

  // Sparks
  drawSparks();

  // Flash
  if(S.flash > 0.01){
    ctx.fillStyle = `rgba(244,208,96,${S.flash * 0.35})`;
    ctx.fillRect(0,0,W,H);
    S.flash *= 0.9;
    if(S.flash < 0.02) S.flash = 0;
  }
}

function drawRadiatingLines(){
  const lines = 72;
  const innerR = R * 0.75;
  const outerR = R * 2.4;
  ctx.save();
  ctx.strokeStyle = 'rgba(212,168,60,0.05)';
  ctx.lineWidth = 0.6;
  for(let i=0;i<lines;i++){
    const a = (i/lines)*Math.PI*2 + S.tick*0.0008;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a)*innerR, CY + Math.sin(a)*innerR);
    ctx.lineTo(CX + Math.cos(a)*outerR, CY + Math.sin(a)*outerR);
    ctx.stroke();
  }
  ctx.restore();
}

function drawNumberRings(){
  NUMBERS.forEach((num, i)=>{
    const cfg = NUM_ANGLES[i];
    const radius = R * cfg.r;
    const rot = S.tick * cfg.speed;

    // Ring selbst (dünn)
    ctx.beginPath();
    ctx.arc(CX, CY, radius, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(212,168,60,${0.06 + i*0.025})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Zahl als Text in der Ring-Mitte
    ctx.save();
    ctx.fillStyle = `rgba(244,208,96,${0.28 + i*0.08})`;
    ctx.font = `${11 + i*1.5}px Consolas, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#d4a83c';
    ctx.shadowBlur = 8;
    // Zahl an einem Winkel, der rotiert
    const a = rot;
    const x = CX + Math.cos(a)*radius;
    const y = CY + Math.sin(a)*radius;
    ctx.fillText(String(num), x, y);
    ctx.restore();

    // Ein paar Ticks (Achsen-Marker) auf dem Ring
    const ticks = i+2;
    for(let k=0;k<ticks;k++){
      const ta = (k/ticks)*Math.PI*2 - rot*2;
      const x1 = CX + Math.cos(ta)*(radius-3);
      const y1 = CY + Math.sin(ta)*(radius-3);
      const x2 = CX + Math.cos(ta)*(radius+3);
      const y2 = CY + Math.sin(ta)*(radius+3);
      ctx.strokeStyle = `rgba(212,168,60,${0.15 + i*0.03})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  });
}

function drawCentralSeal(){
  const pulse = 1 + 0.03*Math.sin(S.tick*0.06);
  const r = R * 0.55 * pulse;

  // Äußerer Siegel-Ring
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(244,208,96,0.65)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#f4d060';
  ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Zweiter dünner Ring
  ctx.beginPath();
  ctx.arc(CX, CY, r*0.88, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(244,208,96,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Kaiserliche Strahlen (8 Speichen)
  ctx.save();
  ctx.strokeStyle = 'rgba(244,208,96,0.5)';
  ctx.lineWidth = 1.5;
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2 + S.tick*0.003;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a)*r*0.35, CY + Math.sin(a)*r*0.35);
    ctx.lineTo(CX + Math.cos(a)*r*0.85, CY + Math.sin(a)*r*0.85);
    ctx.stroke();
  }
  ctx.restore();

  // Sehr innerer Kern-Glow
  const coreG = ctx.createRadialGradient(CX,CY,0,CX,CY,r*0.5);
  coreG.addColorStop(0, 'rgba(244,208,96,0.55)');
  coreG.addColorStop(0.5, 'rgba(212,168,60,0.15)');
  coreG.addColorStop(1, 'rgba(212,168,60,0)');
  ctx.fillStyle = coreG;
  ctx.beginPath(); ctx.arc(CX,CY,r*0.5,0,Math.PI*2); ctx.fill();

  // Inneres Kanji "皇帝" (Kaiser)
  ctx.save();
  ctx.fillStyle = 'rgba(244,208,96,0.85)';
  ctx.font = `bold ${Math.round(r*0.75)}px "Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#f4d060';
  ctx.shadowBlur = 30;
  ctx.fillText('皇', CX, CY);
  ctx.restore();
}

function drawModNodes(){
  for(const n of S.modNodes){
    // Position (leicht rotierend)
    n.a += 0.0008;
    const x = CX + Math.cos(n.a) * n.r;
    const y = CY + Math.sin(n.a) * n.r;
    n.x = x; n.y = y;

    // Glow
    const g = ctx.createRadialGradient(x,y,0,x,y,20);
    g.addColorStop(0, `rgba(244,208,96,${0.5 + n.glow*0.5})`);
    g.addColorStop(1, 'rgba(244,208,96,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();

    // Punkt
    ctx.beginPath();
    ctx.arc(x,y,2.5 + n.glow*1.5,0,Math.PI*2);
    ctx.fillStyle = n.glow > 0.5 ? '#fff5d0' : '#f4d060';
    ctx.shadowColor = '#f4d060';
    ctx.shadowBlur = 10 + n.glow*15;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Label
    ctx.fillStyle = `rgba(200,180,140,${0.4 + n.glow*0.5})`;
    ctx.font = '9px Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name, x, y - 10);

    if(n.glow > 0.01) n.glow *= 0.94;
  }
}

function drawRoomNodes(){
  for(const n of S.roomNodes){
    n.a -= 0.0005;
    const x = CX + Math.cos(n.a) * n.r;
    const y = CY + Math.sin(n.a) * n.r;
    n.x = x; n.y = y;

    // Kleines Quadrat als Marker
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(n.a);
    ctx.strokeStyle = `rgba(212,168,60,${0.5 + n.glow*0.5})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(-3,-3,6,6);
    ctx.restore();

    // Label
    ctx.fillStyle = `rgba(200,180,140,${0.45 + n.glow*0.5})`;
    ctx.font = '9px Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name, x, y - 12);

    if(n.glow > 0.01) n.glow *= 0.94;
  }
}

function drawSparks(){
  for(let i=S.sparks.length-1;i>=0;i--){
    const s = S.sparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.95; s.vy *= 0.95;
    s.life++;
    const a = 1 - s.life/s.maxLife;
    ctx.fillStyle = `rgba(244,208,96,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size*a, 0, Math.PI*2);
    ctx.fill();
    if(s.life > s.maxLife) S.sparks.splice(i,1);
  }
}

// ─── UPDATE / LOOP ────────────────────────────────────────────────
function loop(){
  S.tick++;
  S.auraPulse++;

  // Zufällige module-Pings (als "Achsen werden verifiziert")
  if(Math.random() < 0.015){
    const n = S.modNodes[Math.floor(Math.random()*S.modNodes.length)];
    n.glow = 1;
    spawnSpark(n.x, n.y);
  }
  // Room pings
  if(Math.random() < 0.008){
    const n = S.roomNodes[Math.floor(Math.random()*S.roomNodes.length)];
    n.glow = 1;
    spawnSpark(n.x, n.y);
  }
  // Achsen-Tick (243 pro Zyklus)
  S.axisTick = (S.axisTick + 1) % 243;
  document.getElementById('axisNum').textContent = S.axisTick;

  draw();
  requestAnimationFrame(loop);
}

function spawnSpark(x,y){
  const n = 4 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.3 + Math.random()*1.2;
    S.sparks.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      size: 1 + Math.random()*1.5,
      life: 0,
      maxLife: 30 + Math.random()*20,
    });
  }
}

// ─── SOUND ────────────────────────────────────────────────────────
let audioCtx = null;
function beep(freq, dur, type){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = 0.035;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(_){}
}

// ─── BESTÄTIGUNGS-SEQUENZ ─────────────────────────────────────────
// Die Formel-Zeilen erscheinen nacheinander, jede mit einem Ton.
// Module werden "gepingt", Rooms werden "gepingt".
// Am Ende: Siegel + Bestätigung.

function runConfirmation(){
  const rows = document.querySelectorAll('#formula .row');
  let i = 0;
  const interval = setInterval(()=>{
    if(i >= rows.length){
      clearInterval(interval);
      finishConfirmation();
      return;
    }
    rows[i].classList.add('show');
    // Sound pro Zeile — höher werdend (kaiserliche Tonleiter)
    const freqs = [330, 392, 440, 523, 587, 659];
    beep(freqs[i] || 660, 0.14, 'sine');
    // ein Modul "gepingt"
    if(S.modNodes[i]){
      S.modNodes[i].glow = 1;
      spawnSpark(S.modNodes[i].x, S.modNodes[i].y);
      document.getElementById('modNum').textContent = i + 1;
    }
    if(i < ROOMS.length){
      if(S.roomNodes[i]){
        S.roomNodes[i].glow = 1;
        spawnSpark(S.roomNodes[i].x, S.roomNodes[i].y);
      }
      document.getElementById('roomNum').textContent = i + 1;
    }
    i++;
  }, 420);
}

function finishConfirmation(){
  // Kurz warten, dann alles zeigen
  setTimeout(()=>{
    document.getElementById('sysState').textContent = 'OK';
    document.getElementById('statusNum').textContent = 'BESTÄTIGT';
    document.getElementById('statusNum').style.color = '#8cf0b0';

    // Alle Module final pingen
    S.modNodes.forEach((n,i)=>{
      setTimeout(()=>{
        n.glow = 1;
        spawnSpark(n.x, n.y);
        beep(523 + i*15, 0.06, 'sine');
      }, i*50);
    });
    // Alle Rooms
    S.roomNodes.forEach((n,i)=>{
      setTimeout(()=>{
        n.glow = 1;
        spawnSpark(n.x, n.y);
      }, 600 + i*80);
    });

    // Formel-Töne (kaiserlicher Schlussakkord)
    setTimeout(()=>{
      beep(523, 0.4, 'sine');
      setTimeout(()=>beep(659, 0.4, 'sine'), 180);
      setTimeout(()=>beep(784, 0.6, 'sine'), 360);
      S.flash = 1;
    }, 800);

    // Bestätigung anzeigen
    setTimeout(()=>{
      document.getElementById('sealInfo').classList.add('show');
    }, 1200);

    setTimeout(()=>{
      document.getElementById('confirmed').classList.add('show');
      S.confirmed = true;
    }, 1800);
  }, 300);
}

// ─── INIT ─────────────────────────────────────────────────────────
resize();
document.getElementById('modNum').textContent = '0';
